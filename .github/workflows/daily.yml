name: daily data update

on:
  schedule:
    - cron: "30 1 * * *"     # 07:00 IST
  workflow_dispatch:          # lets you run it manually from the Actions tab

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Cannot be backfilled - runs first so a later failure never costs us it
      - name: Log day-ahead weather forecast
        run: python fetch_weather.py forecast

      - name: Fetch demand data
        run: python fetch_demand.py

      - name: Backfill weather (first run only)
        run: |
          if [ ! -f data/weather_daily.csv ]; then
            echo "no weather history - running one-time backfill"
            python fetch_weather.py backfill
          else
            echo "weather history present - skipping backfill"
          fi

      - name: Append recent actual weather
        run: python fetch_weather.py update

      - name: Rebuild dataset
        run: python build_dataset.py

      - name: Health check
        run: python health_check.py

      # always(): a failed health check still leaves data worth keeping, and
      # the forecast log in particular cannot be reconstructed tomorrow. The
      # run stays red; we just don't throw away what it collected.
      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Open an issue if this run failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily data update failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'automation'
            });
            const body = `Run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.data.some(i => i.title === title)) {
              console.log('issue already open');
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['automation']
              });
            }
